<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Flight360 scenic travel background</title>
  <desc id="desc">An original stylized sunset landscape with mountains, a lake, and warm autumn foliage.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143e61"/>
      <stop offset="0.42" stop-color="#b35a3f"/>
      <stop offset="0.72" stop-color="#e19b55"/>
      <stop offset="1" stop-color="#233c44"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#305967"/>
      <stop offset="1" stop-color="#081a24"/>
    </linearGradient>
    <radialGradient id="sun" cx="52%" cy="35%" r="25%">
      <stop offset="0" stop-color="#ffdba2" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#f7a55b" stop-opacity=".34"/>
      <stop offset="1" stop-color="#f7a55b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <path d="M0 590 210 410 365 545 560 330 780 540 980 300 1210 545 1435 365 1680 560 1920 390 1920 760 0 760Z" fill="#1f3740" opacity=".86"/>
  <path d="M0 660 245 505 390 645 620 460 820 625 1050 445 1270 625 1490 495 1700 635 1920 505 1920 790 0 790Z" fill="#142931" opacity=".86"/>
  <rect y="700" width="1920" height="380" fill="url(#water)"/>
  <ellipse cx="1010" cy="790" rx="380" ry="60" fill="#f3b06f" opacity=".08" filter="url(#blur)"/>

  <g opacity=".95">
    <path d="M0 0h340l-62 95 70 82-105 40 48 95-111 7 30 106-106-44-25 112L0 510Z" fill="#8d351f"/>
    <path d="M0 55h285l-34 85 67 47-88 41 46 72-96 9 32 84-86-34-38 98L0 430Z" fill="#c3622c" opacity=".8"/>
    <path d="M1920 0h-360l72 106-80 69 108 43-57 88 124 18-44 94 109-35 34 113 94 52Z" fill="#7b2d1d"/>
    <path d="M1920 32h-288l44 80-65 55 92 37-35 72 103 4-29 91 95-27 25 95 58 24Z" fill="#d27b32" opacity=".82"/>
  </g>

  <g fill="#0b1d23" opacity=".82">
    <ellipse cx="160" cy="800" rx="220" ry="130"/>
    <ellipse cx="1760" cy="820" rx="250" ry="155"/>
  </g>

  <g opacity=".72" stroke="#d8c7a6" stroke-width="6" fill="none">
    <path d="M120 170c160 50 250 30 395 95"/>
    <path d="M1800 160c-160 20-250 60-400 132"/>
  </g>
